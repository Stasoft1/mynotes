name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MyNotes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -rhoP 'versionName = "\K[^"]+' app/build.gradle* | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk MyNotes.apk
          cp MyNotes.apk "MyNotes-$VER.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MyNotes.apk "MyNotes-$VER.apk" --prerelease \
            --target "${{ github.sha }}" \
            --title "Последняя сборка (версия $VER)" \
            --notes "Версия $VER. Сборка из коммита ${{ github.sha }}"
