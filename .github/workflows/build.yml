name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APKs
        run: gradle :app:assemblePersonalRelease :app:assemblePublicRelease :app:assemblePersonalDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MyNotes-apk
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/apk/personal/debug/*.apk
            app/build/outputs/mapping/*/mapping.txt
          if-no-files-found: error

      - name: Publish public APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -rhoP 'versionName = "\K[^"]+' app/build.gradle* | head -1)
          cp app/build/outputs/apk/public/release/app-public-release.apk "MyNotes-$VER.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "MyNotes-$VER.apk" --prerelease \
            --target "${{ github.sha }}" \
            --title "Последняя сборка (версия $VER)" \
            --notes "Версия $VER."

      - name: Publish personal APKs to the private "mine" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -rhoP 'versionName = "\K[^"]+' app/build.gradle* | head -1)
          cp app/build/outputs/apk/personal/release/app-personal-release.apk "Mine-$VER.apk"
          # Запасной вариант без сжатия кода: если в release что-то сломается, его можно поставить поверх.
          cp app/build/outputs/apk/personal/debug/app-personal-debug.apk Mine-debug.apk
          gh release delete mine --yes --cleanup-tag || true
          gh release create mine "Mine-$VER.apk" Mine-debug.apk --prerelease \
            --target "${{ github.sha }}" \
            --title "Личная сборка (версия $VER)" \
            --notes "Только для владельца."
